# Sobrescrito automaticamente pelo "tofu apply" com o IP real da VM.
# Valores abaixo servem de referencia (rede NAT padrao do libvirt).
[simulador]
burnout-vm ansible_host=192.168.122.100

[simulador:vars]
ansible_user=burnout
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

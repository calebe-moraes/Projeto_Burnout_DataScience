#cloud-config
# Renderizado pelo OpenTofu (templatefile) - ver main.tf
hostname: ${hostname}
manage_etc_hosts: true
timezone: America/Sao_Paulo

users:
  - name: ${usuario}
    gecos: Administrador do Projeto Burnout
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${chave_publica_ssh}

# Somente autenticacao por chave publica
ssh_pwauth: false
disable_root: true

# Marcador para comprovar que o cloud-init foi aplicado
write_files:
  - path: /etc/burnout-cloud-init.txt
    permissions: "0644"
    content: |
      Configurado pelo cloud-init - Projeto Burnout (Grupo 6)
      usuario=${usuario}
      hostname=${hostname}

services:
  app:
    build: .
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dw_burnout
      POSTGRES_USER: grupo6
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no arquivo .env}
    ports:
      - "5432:5432"